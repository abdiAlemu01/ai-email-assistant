[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-email-assistant-backend"
version = "0.1.0"
description = "Backend for AI Email Assistant (FastAPI + Gmail + LangChain)"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "python-dotenv",
  "httpx",
  "pytest",
  "langchain",
  "google-api-python-client",
  "google-auth",
  "google-auth-oauthlib",
  "langchain-community>=0.4.2",
  "langgraph>=1.2.8",
]

[project.urls]
"Homepage" = "https://example.com"
